name: menu_web_v1
description: "Tawla: cafe POS and QR ordering, stored in Supabase."
publish_to: 'none'

version: 2.8.4+47

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  go_router: ^16.2.4
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  provider: ^6.1.5
  supabase_flutter: ^2.10.2
  file_picker: ^8.3.7
  web: ^1.1.1
  printing: ^5.15.1
  flutter_colorpicker: ^1.1.0
  pdf: ^3.13.1
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.6
  http: ^1.5.0
  package_info_plus: ^9.0.1
  image: ^4.12.0
  pinenacl: ^0.6.0
  win32: ^5.15.0
  ffi: ^2.2.0
  audioplayers: ^6.8.1
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700


# Linux is only the CI test runner: load the system libsqlite3 there (checks.yml installs it)
# instead of downloading the prebuilt one, whose GitHub download keeps arriving corrupt on runners.
# Windows, Android and the web keep the default bundled SQLite.
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
