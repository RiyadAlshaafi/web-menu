name: menu_web_v1
description: "Tawla: cafe POS and QR ordering, stored in Supabase."
publish_to: 'none'

version: 1.4.1+7

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.2.4
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  provider: ^6.1.5
  supabase_flutter: ^2.10.2
  file_picker: ^8.3.7
  web: ^1.1.1
  printing: ^5.15.1
  flutter_colorpicker: ^1.1.0
  pdf: ^3.13.1
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.6
  http: ^1.5.0
  package_info_plus: ^9.0.1
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700

