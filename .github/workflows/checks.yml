# The checks every change must pass. Runs on pull requests, and every deploy workflow calls it
# first so nothing goes live untested. The inputs let a deploy skip parts it does not ship.
name: Checks

on:
  pull_request:
  workflow_call:
    inputs:
      flutter:
        type: boolean
        default: true
      guest-web:
        type: boolean
        default: true
      database:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  flutter:
    if: ${{ github.event_name == 'pull_request' || inputs.flutter }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # No .env and no --dart-define: the tests run without a Supabase project.
      - run: flutter test

  guest-web:
    if: ${{ github.event_name == 'pull_request' || inputs.guest-web }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guest-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guest-web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  database:
    if: ${{ github.event_name == 'pull_request' || inputs.database }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Rebuilds the schema from supabase/migrations and runs supabase/tests and the rollbacks.
      - name: Database tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash tool/test_db.sh
