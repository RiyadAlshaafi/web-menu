# Builds the guest web app (guest-web/, Next.js) and deploys it to Cloudflare Workers as
# "tawla-guest" with OpenNext. Needs these repository secrets: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID, SUPABASE_URL, SUPABASE_ANON_KEY. Optional: UPSTASH_REDIS_REST_URL and
# UPSTASH_REDIS_REST_TOKEN (shared rate limits; without them limits are per Worker instance).
name: Guest deploy

on:
  push:
    branches: [main]
    paths: ['guest-web/**', '.github/workflows/guest-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-deploy
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      flutter: false
      guest-web: true
      database: true

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guest-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guest-web/package-lock.json

      - run: npm ci

      # The shared SUPABASE_URL secret may end in /rest/v1 (the Flutter build strips it too).
      - name: Clean the Supabase address
        env:
          RAW_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          url="${RAW_SUPABASE_URL%/}"
          url="${url%/rest/v1}"
          echo "SUPABASE_URL_CLEAN=${url%/}" >> "$GITHUB_ENV"

      - name: Build and deploy
        env:
          # Read at build time and shipped to the browser (public by design).
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL_CLEAN }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Sales page buttons (optional repository variables; a button is hidden when its value is unset).
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
          NEXT_PUBLIC_DEMO_MENU_PATH: ${{ vars.DEMO_MENU_PATH }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Set runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ env.SUPABASE_URL_CLEAN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node -e '
            const keys = ["SUPABASE_URL","SUPABASE_ANON_KEY","UPSTASH_REDIS_REST_URL","UPSTASH_REDIS_REST_TOKEN"];
            const out = Object.fromEntries(keys.filter(k => process.env[k]).map(k => [k, process.env[k]]));
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
          '
          npx wrangler secret bulk secrets.json
          rm secrets.json
