# Publishes a Windows release that tills install by themselves. After raising `version:` in
# pubspec.yaml on main, either push a tag like v1.2.0, or run this workflow by hand from the
# Actions tab (it then creates the tag from pubspec.yaml). See docs/RELEASING.md.
# The release carries the installer and latest.json (version, download link, SHA-256), which
# every till reads every 30 minutes.
# A version with a label (1.6.0-beta.1, tag v1.6.0-beta.1) is published as a pre-release: GitHub
# never makes a pre-release "latest", so tills don't auto-update to it; install it by hand.
name: Windows release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      flutter: true
      guest-web: false
      database: true

  release:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version (and check the tag matches pubspec.yaml)
        shell: bash
        run: |
          ver="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?).*/\1/')"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$ver" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec.yaml version $ver. Raise the version first." >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "Release v$ver already exists. Raise the version in pubspec.yaml first." >&2
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          case "$ver" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac
          echo "TAG=v$ver" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      # The publishable key is public (every web page carries it); repo secrets win when set.
      - name: Write .env
        shell: bash
        env:
          URL_SECRET: ${{ secrets.SUPABASE_URL }}
          KEY_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL=${URL_SECRET:-https://kzafgozkgvcflcizuemr.supabase.co}" > .env
          echo "SUPABASE_ANON_KEY=${KEY_SECRET:-sb_publishable_CWfwwYkp5D8nc_U0x3mjjg_YiYKg0Tj}" >> .env

      - run: flutter pub get

      - run: flutter build windows --release --dart-define-from-file=.env

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          # Setup checks its password against the same Supabase project the app uses.
          $envFile = @{}
          foreach ($line in Get-Content .env) {
            $pair = $line -split '=', 2
            if ($pair.Count -eq 2) { $envFile[$pair[0].Trim()] = $pair[1].Trim() }
          }
          # Only scheme and host, like the app (a secret may hold ".../rest/v1" or a trailing slash).
          $origin = ([Uri]$envFile.SUPABASE_URL).GetLeftPart([UriPartial]::Authority)
          & $iscc "/DAppVersion=$env:VERSION" "/DSupabaseUrl=$origin" "/DSupabaseKey=$($envFile.SUPABASE_ANON_KEY)" windows\installer\cafe_pos.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write latest.json
        shell: pwsh
        run: |
          $file = "build\installer\CafePOS-setup-$env:VERSION.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/CafePOS-setup-$env:VERSION.exe"
          @{ version = $env:VERSION; url = $url; sha256 = $hash; notes = "" } | ConvertTo-Json | Out-File -Encoding utf8NoBOM build\installer\latest.json
          Get-Content build\installer\latest.json

      # Run by hand, this also creates the tag on the commit that was built.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Cafe POS ${{ env.TAG }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          files: |
            build/installer/CafePOS-setup-${{ env.VERSION }}.exe
            build/installer/latest.json
