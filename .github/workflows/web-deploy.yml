# Builds the Flutter web app and deploys it to Cloudflare (Workers static assets, see
# wrangler.jsonc). Needs these repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# SUPABASE_URL, SUPABASE_ANON_KEY.
# Required repository variable GUEST_WEB_URL: where guest QR links forward to (the tawla-guest Worker).
name: Web deploy

on:
  push:
    branches: [main]
    paths-ignore: ['guest-web/**', '.github/workflows/guest-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GUEST_WEB_URL: ${{ vars.GUEST_WEB_URL }}
        run: bash tool/build_web.sh

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
